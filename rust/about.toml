# cargo-about: the licences of the crates built into sobre, written into every
# release archive as THIRD-PARTY-LICENSES.txt. Same list as deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# Only what is linked into the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# These crates compile a bundled C library (jemalloc, Zstandard) into the
# binary but declare only the licence of their Rust code. The library's own
# licence, whose notice every binary must carry, is added here. When either
# crate is updated, check these files again: cargo-about drops a
# clarification whose checksum no longer matches, with only a warning.
[tikv-jemalloc-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-2-Clause"
[[tikv-jemalloc-sys.clarify.files]]
path = "LICENSE-MIT"
license = "MIT"
checksum = "378f5840b258e2779c39418f3f2d7b2ba96f1c7917dd6be0713f88305dbda397"
[[tikv-jemalloc-sys.clarify.files]]
path = "LICENSE-APACHE"
license = "Apache-2.0"
checksum = "a60eea817514531668d7e00765731449fe14d059d3249e0bc93b36de45f759f2"
[[tikv-jemalloc-sys.clarify.files]]
path = "jemalloc/COPYING"
license = "BSD-2-Clause"
checksum = "94aa2caa98c25d942f58b956c71dba6a99ff98fc3a31cbc669fe2a4cd0268b53"

[zstd-sys.clarify]
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
[[zstd-sys.clarify.files]]
path = "LICENSE.Mit"
license = "MIT"
checksum = "129e8edef29e9abcd2ebabe252f4ef1b1289cdca356bf0040284a2fbccfb96c8"
[[zstd-sys.clarify.files]]
path = "LICENSE.Apache-2.0"
license = "Apache-2.0"
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"
[[zstd-sys.clarify.files]]
