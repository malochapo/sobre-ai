# cargo-about: the licences of the crates built into sobre, written into every
# release archive as THIRD-PARTY-LICENSES.txt. Same list as deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# Only what is linked into the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
