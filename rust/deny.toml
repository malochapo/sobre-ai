[graph]
targets = []
all-features = true

[advisories]
# Every vulnerability advisory fails the check unless it is listed in `ignore`
# (none is). Unmaintained-crate advisories fail only for direct dependencies.
unmaintained = "workspace"
yanked = "warn"
unused-ignored-advisory = "warn"
ignore = []

[licenses]
# The licences of the dependency graph, every target and feature included. A
# licence no dependency uses any more is reported, so the list stays the one
# the graph needs.
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
