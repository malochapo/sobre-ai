[workspace]
members = [
  ".",
]
default-members = ["."]

[package]
name = "sobre"
version = "0.1.0"
edition = "2024"
# The toolchain pinned in rust-toolchain.toml; older compilers are untested.
rust-version = "1.99"
autobins = false
description = "sobre: a local context layer for AI coding agents — 13 MCP tools that read, search and run commands with compressed, labelled output. Runs entirely on your machine."
license = "Apache-2.0"
repository = "https://github.com/malochapo/sobre-ai"
# Distributed as release binaries from the repository only: never on crates.io.
publish = false

[lib]
name = "sobre"
path = "src/lib.rs"
# No doctests exist (doc comments hold only `text` and `toml` blocks); without
# this, every `cargo test` runs rustdoc over the whole crate for nothing.
doctest = false

[[bin]]
name = "sobre"
path = "src/main.rs"
# main.rs has no tests: skip building an empty test harness for the binary.
test = false

[[example]]
name = "gen_docs"
path = "src/bin/gen_docs.rs"
required-features = ["dev-tools"]


[features]
default = [
  "tree-sitter",
  "jemalloc",
]

# Local dense retrieval: ONNX embeddings + in-process HNSW. Opt-in rather
# than default so a plain build needs no model download and no ORT runtime
# preflight before the tool is useful. Invariant: everything under
# `dense` runs on the user's machine — no external service.
dense = [
    "dep:ort",
    "dep:ndarray",
    "dep:libloading",
    "dep:tokenizers",
    "dep:tar",
    "dep:zip",
]
# Dense retrieval on a GPU, for source builds (`--features ort-cuda` …).
# Each one turns on `dense`.
ort-cuda = ["dense", "ort/cuda"]
ort-webgpu = ["dense", "ort/webgpu"]
ort-rocm = ["dense", "ort/rocm"]
ort-directml = ["dense", "ort/directml"]
ort-coreml = ["dense", "ort/coreml"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
dev-tools = []
# Helpers only the integration tests call. Enabled for them by
# the self dev-dependency below; never part of a release build.
test-support = []
tree-sitter = [
  "dep:tree-sitter",
  "dep:tree-sitter-rust",
  "dep:tree-sitter-typescript",
  "dep:tree-sitter-javascript",
  "dep:tree-sitter-python",
  "dep:tree-sitter-go",
  "dep:tree-sitter-java",
  "dep:tree-sitter-c",
  "dep:tree-sitter-cpp",
  "dep:tree-sitter-ruby",
  "dep:tree-sitter-c-sharp",
  "dep:tree-sitter-kotlin-ng",
  "dep:tree-sitter-swift",
  "dep:tree-sitter-php",
  "dep:tree-sitter-bash",
  "dep:tree-sitter-dart",
  "dep:tree-sitter-scala",
  "dep:tree-sitter-elixir",
  "dep:tree-sitter-zig",
  "dep:tree-sitter-gdscript",
  "dep:tree-sitter-lua",
  "dep:tree-sitter-luau",
  "dep:tree-sitter-ocaml",
  "dep:tree-sitter-haskell",
  "dep:tree-sitter-julia",
  "dep:tree-sitter-solidity",
  "dep:tree-sitter-nix",
  "dep:tree-sitter-powershell",
]

[dependencies]
# At least 3.5.1: its service loop releases each response-send task as soon as
# it completes, so a long-lived stdio session does not grow in memory.
rmcp = { version = "3.5.1", default-features = false, features = ["server"] }
tiktoken-rs = "0.12"
tokio = { version = "1.52", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-std",
  "io-util",
  "net",
  "sync",
  "time",
  "signal",
] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order: agent configs are edited in place, and their keys must keep
# the order the user wrote them in.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Reads agent JSON/JSONC configs and edits them while keeping comments and
# formatting.
jsonc-parser = { version = "0.34", default-features = false, features = ["cst", "serde", "serde_json"] }
subtle = "2.6"
anyhow = "1.0"
regex = "1.12"
ignore = "0.4"
# `sobre_search` and `sobre_glob` globs, with `{a,b}` alternation.
globset = "0.4.19"
lru = "0.18.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
futures = "0.3"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
toml_edit = "0.25"
similar = "3.1"
flate2 = "1.1"
rusqlite = { version = "0.39", features = ["bundled"] }
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
# tree-sitter-kotlin (fwcd) caps tree-sitter at <0.23; kotlin-ng matches tree-sitter 0.26.
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
# platform-verifier: validate TLS against the OS trust store (corp proxy CAs),
# not just compiled-in webpki-roots. Opt-in per-agent via RootCerts::PlatformVerifier.
ureq = { version = "3.3", features = ["platform-verifier"] }
# PDF → text for the search index (core::extractors).
# 0.12 pulls lopdf >=0.42 (RUSTSEC-2026-0187: stack overflow on deeply nested PDFs).
pdf-extract = "0.12"
tar = { version = "0.4", optional = true }
zip = { version = "8.6", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-scala = { version = "0.26", optional = true }
tree-sitter-elixir = { version = "0.3", optional = true }
tree-sitter-zig = { version = "1.1", optional = true }
tree-sitter-dart = { version = "0.2", optional = true }
tree-sitter-gdscript = { version = "6.1", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-luau = { version = "1.2", optional = true }
# All five below expose the modern `LANGUAGE*: LanguageFn` const (tree-sitter-language
# crate), so they bind to tree-sitter 0.26 via `.into()` like the grammars above.
tree-sitter-ocaml = { version = "0.25", optional = true }
tree-sitter-haskell = { version = "0.23", optional = true }
tree-sitter-julia = { version = "0.23", optional = true }
tree-sitter-solidity = { version = "1.2", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tree-sitter-powershell = { version = "0.26", optional = true }
libloading = { version = "0.8", optional = true }
# Exact pin: `ort` 2.0 is still in its release-candidate phase (no stable 2.0.0
# yet; rc.12 is the upstream-recommended production build). RCs can carry breaking
# API changes between candidates, so `=` prevents `cargo update` from silently
# pulling an unvetted rc.13+ (`ort-sys` is already `=`-pinned transitively).
# Revisit when ort 2.0.0 stable ships.
#
# `load-dynamic` loads `libonnxruntime` at runtime (see `core::ort_environment`)
# rather than linking it at build time. This is deliberate: ort's static
# `download-binaries` has no `x86_64-pc-windows-gnu` artifact (the target of the
# local Windows cross-check) and would statically bloat every test binary.
# Runtime loading keeps builds portable; the shared library is provided by the
# platform package
# (`onnxruntime` on Arch/Homebrew/Nix), `pip install onnxruntime`, or
# `ORT_DYLIB_PATH`.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = [
  "api-24",
  "std",
  "ndarray",
  "tls-rustls",
  "tracing",
  "load-dynamic",
] }
ndarray = { version = "0.17", optional = true }
# Reads any HuggingFace `tokenizer.json` (WordPiece, BPE, Unigram), so every
# embedding model tokenizes exactly as it was trained. Pure Rust regex backend.
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }
axum = "0.8"
base64 = "0.22"
sha2 = "0.11"
glob = "0.3"
urlencoding = "2.1"
strsim = "0.11.1"
strip-ansi-escapes = "0.2.1"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "stream",
] }
bytecount = "0.6"
blake3 = "1.8"
rayon = "1.12"
moka = { version = "0.12", features = ["sync"] }
postcard = { version = "1.1", features = ["use-std"] }
zstd = "0.13"
lsp-types = "0.97"
# Content-Length framing and JSON-RPC message types for the language-server
# client (`lsp/client.rs`); the crate serves clients as well as servers.
lsp-server = "0.10"
# File paths to percent-encoded `file://` URIs for the language-server client.
# Already in the tree through reqwest.
url = "2.5.8"
# PATH lookup with the executable bit on Unix and PATHEXT on Windows.
which = "8.0"
# Process RSS and system RAM for the memory guard, on Linux, macOS and Windows.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
yaml_serde = "0.10.4"
# The command line (cli/args.rs). `suggestions` adds "did you mean" for a
# mistyped command or flag, through strsim, already a dependency (about 8 KB
# in the release binary). Left out: `color` (sobre's own help is plain text),
# `wrap_help` (the help text is wrapped in the source) and `unicode` (every
# name and value name is ASCII).
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "derive",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }

[lints.rust]
unreachable_pub = "warn"
# Dead code is an error. It only catches private items: `pub` items of a
# library are public API, which rustc never reports as unused.
dead_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# --- Style preferences (not quality issues) ---
too_many_lines = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
unreadable_literal = "allow"
# Rust 1.99: prefers assert_eq!(x, "") over assert!(x.is_empty()) in tests.
assert_is_empty = "allow"

# --- Documentation: not required on every public item ---
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

# --- Casts: intentional numeric conversions for token counting, stats, sizing ---
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"

# --- Performance: `push_str(&format!(…))` is common and cheap enough here ---
format_push_string = "allow"

# --- Struct design: option and parameter structs (ConsolidateOptions,
# PatchParams, EditParams, ProjectBuild) are made of flags ---
struct_excessive_bools = "allow"


# --- Float: intentional comparisons in stats/benchmarks ---
float_cmp = "allow"

# --- Style: constants placed near usage for readability ---
items_after_statements = "allow"

# --- Underscore bindings: intentionally named for clarity then used ---
used_underscore_binding = "allow"
no_effect_underscore_binding = "allow"

# --- Micro-optimization: &bool vs bool, readability preferred ---
trivially_copy_pass_by_ref = "allow"

# --- HashMap: we always use default hasher ---
implicit_hasher = "allow"

# Debug info is the bulk of `target/debug` size, and `target/` never GCs — a
# heavily-rebuilt worktree can reach tens of GB. Line-table debuginfo keeps
# `file:line` in panics and backtraces while dropping full variable-level data.
# Set `debug = 2` in a local profile override if you need to step-debug.
[profile.dev]
debug = "line-tables-only"
# Keeps DWARF in per-object files instead of merging into the linked binary
# on every rebuild — cuts incremental link time on Linux.
split-debuginfo = "unpacked"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Pipes",
] }

[target.'cfg(not(windows))'.dependencies]
# Every libc call sits behind cfg(unix) or cfg(not(windows)).
libc = "0.2"
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", optional = true }

[dev-dependencies]
filetime = "0.2"
insta = "1.48"
jsonschema = { version = "0.46", default-features = false }
proptest = "1.11"
serial_test = "3.5"
tempfile = "3.27"
walkdir = "2.5"
sobre = { path = ".", features = ["test-support"] }
