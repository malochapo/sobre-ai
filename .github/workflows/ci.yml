name: CI

# Every pull request into develop or main must pass Lint and the Linux tests.
# macOS and Windows run on push to main (before a release) and on demand
# (workflow_dispatch): the repository is private, where their minutes bill at
# 10x and 2x. A merge into develop does not re-run what its pull request ran.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
      - name: fmt, clippy, doc, generated docs, file size, line ceiling
        run: scripts/preflight.sh
      - name: Dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@5bb39ff5d5a0e94dc9e2dc94eced0c6129743a57 # v2
        with:
          manifest-path: rust/Cargo.toml

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
      - name: cargo test
        working-directory: rust
        run: cargo test --locked
