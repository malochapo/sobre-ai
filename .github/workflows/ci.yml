name: CI

# Every pull request into develop or main must pass Lint and the tests on
# Linux, macOS and Windows. The same jobs run when a push to main calls this
# workflow before a release (release.yml), and on demand (workflow_dispatch).
# A merge into develop does not re-run what its pull request ran.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes. A release's run
# (push, through release.yml) and a manual run do not cancel a run in progress,
# and each event has its own group, so neither can cancel the other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
      - name: fmt, clippy, doc, generated docs, file size
        run: scripts/preflight.sh
      - name: Dependency licenses and advisories
        uses: EmbarkStudios/cargo-deny-action@91bf2b620e09e18d6eb78b92e7861937469acedb # v2.0.17
        with:
          manifest-path: rust/Cargo.toml

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust -> target
      - name: cargo test
        working-directory: rust
        run: cargo test --locked
      - name: cargo test, build with local embeddings
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo test --locked --features dense
      # Linux clippy, both builds, runs in Lint; Windows- and macOS-only code
      # is only seen here.
      - name: cargo clippy
        if: runner.os != 'Linux'
        working-directory: rust
        run: cargo clippy --all-targets --locked -- -D warnings
