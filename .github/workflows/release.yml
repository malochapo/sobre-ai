name: Release

# push to main      → build every target, publish a pre-release vX.Y.Z-rc.N
# tag vX.Y.Z on main → build every target, publish the release vX.Y.Z
# X.Y.Z is the version in rust/Cargo.toml. Nothing is published unless CI
# (lint, and the tests on Linux, macOS and Windows) passes on that commit.
# The notes added to every release are docs/release-notes.md.
#
# Two builds: `sobre-<target>` (default features) and `sobre-dense-<target>`
# (`--features dense`: local embeddings). The dense build loads ONNX Runtime
# at run time, which a static musl binary cannot do, so on Linux it targets
# glibc 2.28 (the floor of Microsoft's own ONNX Runtime builds). Intel macOS
# has no dense build: Microsoft ships no ONNX Runtime 1.24 for it.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Only the publish job writes: it creates the release and its tag.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Resolve version
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match rust/Cargo.toml version $version"
              exit 1
            fi
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::v$version is already released; bump the version in rust/Cargo.toml"
              exit 1
            fi
            # rc.N is one more than the highest rc tag or release of this
            # version, so a deleted release or a leftover tag never brings a
            # number back.
            version_re="${version//./\\.}"
            n="$(
              {
                gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version-rc." \
                  --jq '.[].ref | ltrimstr("refs/tags/")'
                gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName'
              } | sed -n "s/^v$version_re-rc\.\([0-9][0-9]*\)\$/\1/p" | sort -n | tail -n 1
            )"
            echo "tag=v$version-rc.$((${n:-0} + 1))" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  licenses:
    name: Third-party licences
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: rustup toolchain install
      # cargo-about writes the licence of every crate linked into sobre
      # (rust/about.toml, rust/about.hbs); every archive ships the result.
      - name: Install cargo-about
        run: |
          curl -fsSL -o cargo-about.tgz https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  cargo-about.tgz" | sha256sum --check
          tar xzf cargo-about.tgz --strip-components=1 -C "$RUNNER_TEMP" cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Write THIRD-PARTY-LICENSES.txt
        working-directory: rust
        shell: bash
        run: |
          cargo about generate --locked --all-features about.hbs -o ../THIRD-PARTY-LICENSES.txt 2>&1 | tee about.log
          # A clarification whose checksum no longer matches is dropped with a
          # warning only, and its licence text would be missing from the archives.
          if grep -q "failed to validate" about.log; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt

  build:
    name: Build ${{ matrix.name }}
    needs: [version, licenses]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sobre-x86_64-unknown-linux-musl, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { name: sobre-aarch64-unknown-linux-musl, target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { name: sobre-x86_64-apple-darwin, target: x86_64-apple-darwin, os: macos-latest }
          - { name: sobre-aarch64-apple-darwin, target: aarch64-apple-darwin, os: macos-latest }
          - { name: sobre-x86_64-pc-windows-msvc, target: x86_64-pc-windows-msvc, os: windows-latest }
          - { name: sobre-dense-x86_64-unknown-linux-gnu, target: x86_64-unknown-linux-gnu, zig_target: x86_64-unknown-linux-gnu.2.28, os: ubuntu-latest, features: dense }
          - { name: sobre-dense-aarch64-unknown-linux-gnu, target: aarch64-unknown-linux-gnu, zig_target: aarch64-unknown-linux-gnu.2.28, os: ubuntu-latest, features: dense }
          - { name: sobre-dense-aarch64-apple-darwin, target: aarch64-apple-darwin, os: macos-latest, features: dense }
          - { name: sobre-dense-x86_64-pc-windows-msvc, target: x86_64-pc-windows-msvc, os: windows-latest, features: dense }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain (rust/rust-toolchain.toml)
        working-directory: rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      # cargo-zigbuild >= 0.23 drops the `--fix-cortex-a53-843419` linker flag
      # rustc passes for aarch64, which zig's linker rejects.
      - name: Install zig and cargo-zigbuild (Linux cross builds)
        if: runner.os == 'Linux'
        run: |
          pip3 install -q ziglang==0.16.0
          python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild@0.23.4
      - name: Build
        working-directory: rust
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}
          ZIG_TARGET: ${{ matrix.zig_target || matrix.target }}
          TAG: ${{ needs.version.outputs.tag }}
          # Link the C runtime statically on Windows, so sobre.exe starts on a
          # machine without the Visual C++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows-msvc') && '-C target-feature=+crt-static' || '' }}
        run: |
          # `sobre --version` reports the release's own version (0.1.0-rc.2).
          export SOBRE_RELEASE_VERSION="${TAG#v}"
          flags=(--release --locked)
          [[ -n "$FEATURES" ]] && flags+=(--features "$FEATURES")
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo zigbuild "${flags[@]}" --target "$ZIG_TARGET"
          else
            cargo build "${flags[@]}" --target ${{ matrix.target }}
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: third-party-licenses
      # Each archive holds the binary, the licence, the attribution notices
      # and the licences of the crates built into it.
      - name: Package
        shell: bash
        run: |
          name="${{ matrix.name }}"
          dir="rust/target/${{ matrix.target }}/release"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a "$name.zip" "./$dir/sobre.exe" LICENSE NOTICE THIRD-PARTY-LICENSES.txt
          else
            tar czf "$name.tar.gz" -C "$dir" sobre -C "$GITHUB_WORKSPACE" LICENSE NOTICE THIRD-PARTY-LICENSES.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docs/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          sha256sum sobre-* > SHA256SUMS
          flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file docs/release-notes.md)
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" sobre-* SHA256SUMS
