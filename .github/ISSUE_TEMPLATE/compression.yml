name: Command output compression
description: A command whose output sobre compresses badly, or does not compress
title: "compression: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Remove anything private from the outputs you paste.
  - type: input
    id: version
    attributes:
      label: sobre version
      description: The output of `sobre --version`
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: e.g. nix build, pre-commit run, phpstan
    validations:
      required: true
  - type: textarea
    id: raw
    attributes:
      label: The exact output
      description: The output of `sobre raw "<command>"`
      render: text
    validations:
      required: true
  - type: textarea
    id: compressed
    attributes:
      label: What sobre gave
      description: The output of `sobre -c "<command>"`
      render: text
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: What is missing, or what should have been cut
    validations:
      required: true
